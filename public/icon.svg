<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#1e293b" stroke-width="8" />

  <!-- Background subtle grid glow -->
  <circle cx="256" cy="256" r="180" fill="#06b6d4" opacity="0.12" filter="blur(40px)" />

  <!-- Stylized Downward Flux Arrow / Bolt -->
  <g filter="url(#glow)">
    <!-- Main arrow shaft & head -->
    <path d="M256 100 L256 310 M170 230 L256 320 L342 230" 
          stroke="url(#cyanGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
    
    <!-- Base tray with flux accent -->
    <path d="M140 370 L140 400 C140 412 150 422 162 422 L350 422 C362 422 372 412 372 400 L372 370" 
          stroke="url(#cyanGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
          
    <!-- Dynamic dots/energy pulse -->
    <circle cx="256" cy="370" r="10" fill="#38bdf8" />
  </g>
</svg>
